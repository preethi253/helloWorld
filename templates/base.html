<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Website{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- I created a dark navigation bar.  -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2">
        <div class="container justify-content-end">

            <!-- This links to the favorite course page.  -->
            <a class="nav-link text-white me-3"
               href="/favorite-course">
                Favorite Course
            </a>

            <!-- Link to the contact page.  -->
            <a class="nav-link text-white"
               href="/contact">
                Contact
            </a>
        </div>
    </nav>

    <!-- This is where each page will have there information -->
    <main class="container py-5 flex-grow-1">

        <!--This is where the pages can use the format by inheritance.
        The different pages will just display their own information. -->
        {% block content %}{% endblock %}

    </main>

    <!--I used a dark footer with white text. I want it to be similar to the
     navigation bar. -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 small">Made by Preethi Narayanan · 2026</p>
    </footer>

    <!-- I used the example given in class  and made sure the script was there. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

</body>
</html>
